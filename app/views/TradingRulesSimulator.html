<!DOCTYPE html>
<html lang="en">
<head>

<title>Trading Rules Simulator (v0.1 DRAFT 09 Jun 2026)</title>
<style>
:root{
  --ink:#1a1f2c; --muted:#6b7280; --line:#d8dce3; --line2:#e6e7eb;
  --blue:#eef3fb; --blue2:#dbe5f4; --navy:#1e3a8a;
  --green:#c8e6c9; --greenborder:#7cb083; --darkgreen:#1b5e20;
  --grey:#e6e7eb; --yellow:#fff7c2; --red:#fde0e0; --redink:#b91c1c;
  --bg:#f4f6f9; --card:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);font-size:13px;line-height:1.4}
header.sticky{position:sticky;top:0;z-index:50;background:var(--card);
  border-bottom:2px solid var(--line);padding:12px 18px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h1.title{font-size:22px;margin:0 0 8px;letter-spacing:.3px}
.bars{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:10px}
.bar{display:flex;gap:6px;align-items:center}
.bar .lbl{font-weight:600;color:var(--muted);margin-right:4px;font-size:12px}
.radio{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.radio button{border:0;background:var(--card);padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.radio button+button{border-left:1px solid var(--line)}
.radio button.active{background:var(--navy);color:#fff;font-weight:600}
table.summary{border-collapse:collapse;font-size:12px;margin-left:auto}
table.summary th,table.summary td{border:1px solid var(--line);padding:2px 7px;text-align:right;white-space:nowrap}
table.summary th{background:var(--blue);font-weight:600}
table.summary td.type{text-align:left;font-weight:600}
table.summary td.units{background:var(--yellow)}
.gain-good{color:var(--darkgreen);font-weight:700}
.gain-bad{color:var(--redink);font-weight:700}
.tr-pass{color:var(--darkgreen);font-weight:700}
.tr-fail{color:var(--redink);font-weight:700}
.valid-banner{text-align:right;font-size:22px;font-weight:800;letter-spacing:1px;
  color:var(--darkgreen);padding:0;display:none;white-space:nowrap}
.head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.dev-strap{color:var(--redink);font-style:italic;font-size:13px;margin:2px 0 0}
.valid-banner.invalid{color:var(--redink)}
.valid-banner.show{display:block}
main{padding:18px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:22px;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.card-title{font-size:28px;font-weight:700;margin:0}
.sub-title{font-size:22px;font-weight:700;margin:18px 0 2px}
.strap{font-style:italic;color:var(--muted);font-size:12px;margin:0 0 8px}
.head-ctrl{display:flex;gap:8px;align-items:center}
.head-ctrl input[type=number]{width:54px;padding:4px;border:1px solid var(--line);border-radius:5px;font-size:13px}
button.act{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:6px;padding:6px 12px;
  cursor:pointer;font-size:12.5px;font-weight:600}
button.act.alt{background:#fff;color:var(--navy)}
button.act:hover{opacity:.9}
.tbl-wrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:auto;font-size:12px}
table.grid th,table.grid td{border:1px solid var(--line2);padding:2px 6px;text-align:left;vertical-align:middle;white-space:nowrap}
table.grid th{background:var(--blue);font-weight:600;font-size:11.5px;white-space:nowrap}
td.num{text-align:right;white-space:nowrap}
table.grid td.calc{font-size:10.5px;color:var(--muted);max-width:230px;white-space:normal}
.broadcol{color:#9aa1ad;font-size:11px}
.units-cell{background:var(--yellow);text-align:right;font-weight:600}
.units-green{background:var(--green)!important}
.flag-red{background:var(--red)!important}
.parent-row td{background:var(--blue);font-weight:600}
.fc-row td{border-bottom:3px solid #000}
.pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:10.5px;font-weight:700;white-space:nowrap}
.pill-baseline{background:var(--blue2);border:1px solid var(--line)}
.pill-retained{background:var(--grey);border:1px solid var(--line)}
.pill-enhanced{background:var(--green);border:1px solid var(--line)}
.pill-fc{background:#fff;border:1.5px solid var(--ink)}
.pct{color:var(--navy);font-weight:700;margin-right:4px}
.usuf{color:var(--muted);font-size:10.5px;margin-left:3px}
.size-in{width:74px;padding:3px;border:1px solid var(--line);border-radius:4px;font-size:12px;text-align:right}
.flowbox .kv{display:flex;justify-content:space-between;gap:10px;padding:1px 0;font-size:11.5px}
.flowbox .kv.flow{padding-left:10px;color:var(--ink)}
.flowbox .sub{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.flowbox hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.flowbox .flowline{padding:2px 0;font-size:11.5px}
.trade-cell{font-size:12px;color:#3a6ea5;white-space:nowrap}
.trade-cell div{padding:1px 0}
.avail-head{font-size:11.5px;margin-bottom:6px}
.avail-num{font-size:18px;font-weight:800;color:var(--navy)}
.flowbox .kv.flow span i{color:var(--muted)}
select.hab,select.cond{font-size:12.5px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;
  max-width:240px;background:#fff}
select.hab.sel-green{background:var(--green);border-color:var(--greenborder)}
select.hab optgroup{font-size:17px;font-weight:700;background:var(--blue);padding:5px 6px}
select.hab option{font-size:12.5px;line-height:1.2;padding:0 8px;background:#fff;color:var(--ink);font-weight:400}
select.hab option.sentinel{font-style:italic;color:var(--muted)}
.enh-clear{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
  background:var(--ink);color:#fff;border:0;cursor:pointer;font-size:12px;line-height:1;margin-left:5px;padding:0}
.enh-clear:hover{background:#000}
.enh-clear.hidden{display:none}
.qhelp{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
  border:1px solid var(--muted);color:var(--muted);font-size:10px;cursor:help;margin-left:4px;position:relative}
.qhelp .pop{display:none;position:absolute;left:18px;top:-4px;z-index:80;background:#fff;border:1px solid var(--line);
  border-radius:6px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.15);width:260px;font-size:11.5px;
  white-space:normal;color:var(--ink);text-align:left}
.qhelp:hover .pop{display:block}
.qhelp .pop b{font-weight:700}
.muted-italic{font-style:italic;color:var(--muted)}
.mismatch{background:var(--red);border:1px solid var(--redink);color:var(--redink);padding:7px 10px;border-radius:6px;
  font-size:12px;font-weight:600;margin:8px 0;display:none}
.mismatch.show{display:block}
.pill-summary{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin-top:10px}
.pill-summary .line{display:flex;align-items:center;gap:8px;font-size:12px}
.band{padding:6px 10px;border-radius:6px 6px 0 0;margin-top:14px}
.band h4{margin:0;font-size:22px;font-weight:700}
.band .rule{font-size:16px;font-weight:500}
.band-vhigh{background:#e1d5f0}.band-high{background:#d6e6c7}.band-medium{background:#fdeecb}
.band-low{background:#d8eef6}.band-vlow{background:#eceef1}
.flowbox{background:var(--blue);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:11.5px;margin:0}
.yy{color:var(--darkgreen);font-weight:700}.nn{color:#9aa1ad}
.detail-wrap{display:flex;gap:16px;flex-wrap:nowrap;align-items:flex-start}
.detail-wrap .tbl-wrap{flex:0 1 auto;min-width:0;overflow-x:auto}
.detail-wrap table.grid{width:auto}
.detail-wrap .side{flex:0 0 340px;width:340px}
@media (max-width:1100px){.detail-wrap{flex-wrap:wrap}.detail-wrap .side{flex:1 1 100%;width:auto}}
/* Header summary: Units (Change) / Net Gain % / Trading Rules cell styling */
table.summary th.th-uc, table.summary td.uc-cell{border-right:3px solid #000}
table.summary td.uc-cell{background:var(--yellow);font-weight:400;color:var(--ink)}
table.summary td.ng-good{background:#1b7f3b;color:#fff;font-weight:700;font-size:14px}
table.summary td.ng-bad{background:#c0392b;color:#fff;font-weight:700;font-size:14px}
table.summary td.tr-pass-cell{background:#1b7f3b;color:#fff;font-weight:700;font-size:14px;text-align:center}
table.summary td.tr-fail-cell{background:#c0392b;color:#fff;font-weight:700;font-size:14px;text-align:center}
/* stack the two radio bars vertically; created totals row; stronger mismatch banner */
.bars{align-items:flex-start}
.radio-bars{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.totals-row td{background:#eef1f5;font-weight:700;border-top:2px solid var(--ink)}
.mismatch{background:var(--redink);color:#fff;border:1px solid var(--redink)}
/* R/E grid tweaks: grey bin button, grey size % pill, left-opening calc tooltip */
.enh-clear{background:#9aa1ad}
.enh-clear:hover{background:#6b7280}
.pct-pill{display:inline-block;background:var(--grey);color:var(--ink);border-radius:9px;padding:0 6px;font-size:10px;font-weight:700;margin-right:4px}
.qhelp.qleft .pop{left:auto;right:18px}
/* baseline parent row: thick top border; narrow habitat column */
table.grid tr.parent-row td{border-top:3px solid #000}
table.grid td.hab-cell{max-width:190px;white-space:normal;word-break:break-word}
select.hab{max-width:175px}
/* dropdown font sizes to grid-normal; grey "?" icon; failed-trading-rules flag */
select.hab,select.cond{font-size:12px}
select.hab option,select.cond option{font-size:12px}
select.hab optgroup{font-size:12px;font-weight:700}
.qhelp{background:#9aa1ad;color:#fff;border-color:#9aa1ad}
.fail-bg{background:#fde0e0!important}
.fail-tag{color:var(--redink);font-weight:700;font-style:italic;font-size:10.5px}
/* keep habitat dropdown + clear button inside the cell (no overflow into next column) */
.enh-wrap{display:flex;align-items:center;gap:4px;max-width:100%}
.enh-wrap select.hab{flex:1 1 auto;min-width:0;max-width:none}
.enh-wrap .enh-clear{flex:0 0 auto}
/* enhanced/created habitat cell sizes to dropdown content (avoid collapsed-name truncation) */
table.grid td.hab-cell-enh{white-space:nowrap;vertical-align:middle;max-width:none}
.enh-wrap{display:inline-flex;align-items:center;gap:4px;max-width:none}
.enh-wrap select.hab{flex:0 0 auto;min-width:0;max-width:260px}
/* faint "Post" marker in the ID column of child rows */
.post-id{color:#b8bdc6;font-style:italic;font-size:11px}
/* For Creation net (Retained + Enhanced - Baseline) */
.net-loss{background:#fdecec}
.net-gain{background:#e7f6e7}
/* R/E pill recolour, band lozenge, invalid dropdown, New Habitat Units border, retained grey */
.pill-enhanced{background:var(--grey)}
.pill-fc{background:var(--grey);border:1px solid var(--line)}
.pill-band{background:var(--green);border:1px solid var(--line)}
select.hab.sel-invalid{background:var(--red);border-color:var(--redink)}
.nh-col{border-right:2px solid #000}
.rt-grey{color:#9aa1ad}
/* Size column black left border; white-bg bold gain/loss on units columns */
.size-col{border-left:2px solid #000}
.u-gain{background:#fff;color:var(--darkgreen);font-weight:700}
.u-loss{background:#fff;color:var(--redink);font-weight:700}
/* black grid header row; habitat dropdowns sized to content (width set by JS) */
table.grid th{background:#000;color:#fff}
select.hab{max-width:none}
.enh-wrap select.hab{max-width:none}
/* "Rules" pill (was the "?" trade-rule trigger) */
.qhelp.rules-pill{width:auto;height:auto;border-radius:10px;padding:1px 7px;background:#000;color:#fff;font-size:10px;font-weight:700;border:0;margin-left:4px}
/* size inputs left-justified (width set by JS); wider Rules tooltip with bold labels only; new-habitat enhancement highlight */
.size-in{text-align:left}
.qhelp .pop{font-weight:400;width:440px}
.pill-enhanced-green{background:var(--green)!important}
select.hab.newhab-text{background:#e8f5e9;color:#000;border-color:#bcd9bd}

.card-head{flex-direction:column;align-items:flex-start}
.card-fit{width:fit-content;max-width:100%}
.band .rule{font-size:12.5px;font-weight:400}
/* created dropdown lighter green; bigger card spacing+darker border; offsets subheading; consistent trading grid columns */
select.hab.cr-lite{background:#e8f5e9!important;border-color:#bcd9bd!important}
.card{margin-bottom:44px;border:1px solid #8a909c}
.offsets-sub{font-weight:600;text-decoration:underline;margin-top:6px;font-size:11.5px}
.trd{table-layout:fixed}
.trd th,.trd td{white-space:normal;overflow:hidden;vertical-align:top}
.cr-id{display:none}
select.hab option.grp-top{border-top:1px solid #b9bfca}

.cell-null{background:#eef0f3}
.trd-broad{color:#000}
.trd-hab{font-weight:700}
.totals-row td{border-top:2px solid #000!important}

.u-bg{background:var(--yellow)}
.band{margin-top:28px}
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#9aa1ad;color:#fff;border:0;font-size:10px;cursor:pointer;margin-left:5px;padding:0;vertical-align:middle}

.modal-overlay{background:rgba(0,0,0,0)}

.bars{margin-top:14px}
.pass-pill{background:var(--darkgreen);color:#fff;font-weight:700;padding:1px 9px;border-radius:10px;display:inline-block}

.rules-pass{background:var(--darkgreen);color:#fff;font-weight:700;text-align:center}
.rules-fail{background:var(--redink);color:#fff;font-weight:700;text-align:center}
.band{display:flex;align-items:center;gap:12px}
.trd td.num{text-align:right}
.trd td.trade-cell{text-align:center}
.trd td.rules-col{text-align:center}
.created-head{margin-top:34px;margin-bottom:16px}
button.act.act-green{background:var(--darkgreen);border-color:var(--darkgreen);color:#fff}

.net-unchanged{color:#000;font-weight:400}
table.grid td.units-cell{text-align:right}

</style>
</head>

  </div>
</header>

function distScore(t,d){ return DIST_SCORE[t][d]; }

  if(h.conds && h.conds.length) return h.conds;

  if(years==null) return null;

/* ---------- trading rule ---------- */
// Condition-aware trading rule (v2). base/post carry dist, broad, name and (optionally) cond.
// When conditions are unknown (habitat-only candidacy, e.g. dropdowns / offset matching) the
// condition test is treated as satisfied so structural eligibility still works.
function condModeOf(x){ return (x && (x.condMode || (x.hab && x.hab.condMode))) || "Assessed"; }
// Trading rule mirroring the v3 Trading Rules Widget (matchReasons). Structural eligibility
// (distinctiveness / broad / habitat / condition-availability); the "better condition"
// requirement is enforced by condition selection (bestEnhCond / condOptions), exactly as v3.
function checkTradingRule(t, base, post){
  if(!base||!post) return false;
  const bd=base.dist, pd=post.dist;
  const bs=distScore(t,bd), ps=distScore(t,pd);
  if(!bs || !ps) return false;                 // score 0 (Area Very Low) -> no trade applies
  const sameHab = post.name===base.name;
  const sameBroad = post.broad===base.broad;
  const baseNoCond = condModeOf(base)!=="Assessed";
  const postNoCond = condModeOf(post)!=="Assessed";
  // A same-distinctiveness candidate that has no condition assessment can never be a valid
  // trade (it cannot be enhanced to a better condition).
  if(pd===bd && postNoCond) return false;
  if(t==="area"){
    if(bd==="V.High"||bd==="High") return sameHab;
    if(bd==="Medium"){
      if(ps>bs) return true;                                  // higher distinctiveness
      if(ps===bs){
        if(baseNoCond) return !postNoCond;                    // CA N/A baseline: any broad
        if(sameBroad) return true;                            // assessed baseline: same broad
        if(INTERTIDAL.has(base.broad) && INTERTIDAL.has(post.broad)) return true; // intertidal cross-pair
      }
      return false;
    }
    return ps>=bs;                                            // Low (Very Low excluded by score 0)
  }
  if(t==="hedgerow"){
    if(bd==="V.High") return sameHab;
    if(bd==="High") return sameHab || ps>bs;
    return ps>=bs;                                            // Medium / Low / Very Low
  }
  // watercourse
  if(bd==="V.High"||bd==="High"||bd==="Medium") return sameHab;
  if(bd==="Low") return sameHab || ps>bs;                     // like-for-like (culvert) or higher
  return false;                                               // Very Low (none)
}
function getTradingRuleText(t,dist){ return TRADING_RULES[t][dist]||""; }
// Whether a loss at this distinctiveness band needs compensation at all.
function compRequired(t,dist){ if(t==="hedgerow") return true; return dist!=="V.Low"; }
// Can a loss at baseline b be offset by any habitat other than itself? (false = same-habitat-required)
function lossOffsettable(t,b){
  if(!compRequired(t,b.dist)) return true; // no compensation needed, never a failure
  return pool(t).some(h=> h.name!==b.name && checkTradingRule(t,b,h));
}

/* ---------- pools ---------- */
let filter="MVS";
function pool(t){
  return byType[t].filter(h=> filter==="All" || MVS.has(h.dist));
}

/* ---------- condition selection ---------- */
function biasedBaselineCond(h){
  const cs=condsFor(h);
  if(h.condMode!=="Assessed") return cs[0];
  const avail=ASSESSED.filter(c=>cs.includes(c)); // grades this habitat has, low->high
  if(avail.length<=1) return avail[0]||cs[0];
  const pool=avail.slice(0,avail.length-1);        // drop top grade -> enhancement headroom
  return pool[Math.floor(pool.length/2)] || pool[0];
}
// best target condition for enhancement of a habitat above a baseline rank
function bestEnhCond(t,h,minRankExclusive){
  const cs=condsFor(h);
  if(h.condMode!=="Assessed"){
    const c=cs[0];
    return enhancementYears(t,h,c)!=null?c:null;
  }
  for(let i=ASSESSED.length-1;i>minRankExclusive;i--){
    const c=ASSESSED[i];
    if(!cs.includes(c)) continue;                  // only conditions this habitat has
    if(enhancementYears(t,h,c)!=null) return c;
  }
  return null;
}
// best created condition maximising condScore*timeMult
function bestCreatedCond(t,h){
  const cs=condsFor(h); let best=null,bestVal=-1;
  cs.forEach(c=>{
    const y=creationYears(t,h,c); if(y==null) return;
    const tm=timeMultYears(y); if(tm==null) return;
    const val=COND_SCORE[c]*tm;
    if(val>bestVal){bestVal=val;best=c;}
  });
  return best;
}

/* ---------- enhancement picker ---------- */
function pickEnhancement(t, base){

  if(baseHab.condMode==="Assessed" && checkTradingRule(t,base,baseHab)){
    const br=ASSESSED.indexOf(base.cond);
    const c=bestEnhCond(t,baseHab,br);
    if(c) return {hab:baseHab, cond:c, kind:"cond"};

    cands.sort((a,b)=>{
      const da=DIST_RANK[a.dist]>DIST_RANK[base.dist]?0:1;

      return sa-sb;

}

/* ---------- unit calcs ---------- */
function baselineUnits(t,b){ return b.size*distScore(t,b.dist)*COND_SCORE[b.cond]*b.ss; }

/* ---------- size distribution ---------- */
function splitSizes(total,n,minEach,dp){
  let parts=[]; let rem=total;
  for(let i=0;i<n;i++){
    const left=n-i-1;
    const maxHere=rem-left*minEach;
    let v= i===n-1 ? rem : roundN(minEach+Math.random()*(maxHere-minEach),dp);
    if(v<minEach) v=minEach; if(v>maxHere) v=maxHere;
    v=roundN(v,dp); parts.push(v); rem=roundN(rem-v,dp);
  }
  // fix rounding into last
  const s=parts.reduce((a,b)=>a+b,0);
  parts[n-1]=roundN(parts[n-1]+(total-s),dp);
  return parts;
}

/* ---------- baseline generation ---------- */
// When more than 5 habitats are required for an intervention type, make ~1/3 of them duplicates.
function dupSplit(n){ const dup = n>5 ? Math.min(n-1, Math.max(1, Math.round(n/3))) : 0; return {dup, distinct:n-dup}; }
function baselineCondVaried(h, used){
  const cs=condsFor(h); const u=used[h.name]||(used[h.name]=new Set());
  if(h.condMode==="Assessed"){
    const avail=ASSESSED.filter(c=>cs.includes(c));
    const pref=avail.slice(0,Math.max(1,avail.length-1)); // drop top grade -> enhancement headroom
    const unused=pref.filter(c=>!u.has(c));
    let c = unused.length? pick(unused) : (pref.length? pick(pref) : (avail[0]||cs[0]));
    u.add(c); return c;
  }
  const c=cs[0]; u.add(c); return c;
}
function createdCondVaried(t,h,used){
  const u=used[h.name]||(used[h.name]=new Set());
  const valid=condsFor(h).filter(c=>{const y=creationYears(t,h,c); return y!=null && timeMultYears(y)!=null;});
  const list=valid.length? valid.slice().sort((a,b)=>COND_SCORE[b]-COND_SCORE[a]) : [bestCreatedCond(t,h)||condsFor(h)[0]];
  let c; if(!u.size){ c=bestCreatedCond(t,h)||list[0]; } else { c=list.find(x=>!u.has(x))||list[0]; }
  u.add(c); return c;
}
function enhValidConds(t,h){ return condsFor(h).filter(c=>{const y=enhancementYears(t,h,c); return y!=null && timeMultYears(y)!=null;}); }
function bestEnhCondVaried(t,h,used){
  const list=enhValidConds(t,h).slice().sort((a,b)=>COND_SCORE[b]-COND_SCORE[a]);
  if(!list.length) return null;
  const u=used[h.name]||(used[h.name]=new Set());
  let c=list.find(x=>!u.has(x))||list[0]; u.add(c); return c;
}
function genBaseline(t){
  const p=pool(t); const n=baselineCounts[t]; const dp=dp_for(t);
  const {dup:dupCount, distinct:distinctTarget}=dupSplit(n);
  const chosen=[]; const usedNames=new Set();
  const addUnique=h=>{ chosen.push(h); usedNames.add(h.name); };
  const bands=[...new Set(p.map(h=>h.dist))];
  bands.forEach(d=>{ if(chosen.length<distinctTarget){ const opts=p.filter(h=>h.dist===d && !usedNames.has(h.name)); if(opts.length) addUnique(pick(opts)); }});
  while(chosen.length<distinctTarget){ const opts=p.filter(h=>!usedNames.has(h.name)); if(!opts.length) break; addUnique(pick(opts)); }
  if(t==="area"){
    const dev=byType.area.find(h=>h.name==="Developed land; sealed surface");
    if(dev && !usedNames.has(dev.name) && chosen.length){ usedNames.delete(chosen[chosen.length-1].name); chosen[chosen.length-1]=dev; usedNames.add(dev.name); }
  }
  // intentional duplicates (prefer Assessed habitats so their conditions can differ)
  for(let i=0;i<dupCount && chosen.length<n;i++){
    const assessed=chosen.filter(h=>h.condMode==="Assessed");
    chosen.push(assessed.length? pick(assessed) : (chosen.length? pick(chosen) : pick(p)));
  }
  while(chosen.length<n) chosen.push(pick(p));
  // sizes
  let sizes;
  if(t==="area"){
    sizes=chosen.map(()=>round2(rnd(0.5,3.0)));
    let tot=sizes.reduce((a,b)=>a+b,0);
    if(tot>AREA_CAP){ const f=AREA_CAP/tot; sizes=sizes.map(s=>round2(s*f)); }
  } else {
    sizes=splitSizes(FIXED_TOTAL[t],n,TYPE_MIN_INDIVIDUAL[t],dp);
  }
  const condUsed={};
  return chosen.map((h,i)=>{
    let cond=baselineCondVaried(h, condUsed);
    const row={id:TYPE_PREFIX[t]+(i+1), hab:h, name:h.name, broad:h.broad, dist:h.dist,
      cond:cond, size:sizes[i], ss:1, ripEncr:"-", wcEncr:"-"};
    if(t==="watercourse"){
      if(h.name==="Culvert"){ row.ripEncr="N/A - Culvert"; row.wcEncr="N/A - Culvert"; }
      else { row.ripEncr=pick(["None","Low","Medium"]); row.wcEncr=pick(["None","Low","Medium"]); }
    }
    return row;
  });
}

/* ---------- post generation ---------- */
function buildPostSet(t, baselines, mode){
  const dp=dp_for(t);
  const baseTotal=baselines.reduce((a,b)=>a+b.size,0)||1;
  const createdShare=0.25+Math.random()*0.10;
  const groups=baselines.map((b,bi)=>{
    const enhPick=pickEnhancement(t,b);
    const canEnh=enhPick!=null;
    // Same-habitat-required baselines (e.g. High/V.High area) can't have their losses traded away,
    // so don't strip area to For Creation — keep them fully retained/enhanced (no net unit loss).
    const mustRetain = (mode!=="errors") && !lossOffsettable(t,b);
    // For Creation size
    let lost = mustRetain ? 0 : b.size*createdShare*(mode==="valid"?(0.85+0.3*Math.random()):(0.5+Math.random()));
    lost=Math.min(b.size, Math.max(0, roundN(lost,dp)));
    let remaining=roundN(b.size-lost,dp);
    let enhSize=0, retSize=remaining;
    if(canEnh && remaining>TYPE_MIN_INDIVIDUAL[t]*1.5){
      const frac = mode==="valid" ? (0.45+0.35*Math.random()) : (0.25+0.4*Math.random());
      enhSize=Math.max(TYPE_MIN_INDIVIDUAL[t], roundN(remaining*frac,dp));
      if(enhSize>remaining) enhSize=remaining;
      retSize=roundN(remaining-enhSize,dp);
      if(retSize<0){retSize=0;enhSize=remaining;}
    }
    // reconcile so ret+enh+lost == size
    lost=roundN(b.size-retSize-enhSize,dp);
    if(lost<0){ retSize=roundN(retSize+lost,dp); lost=0; if(retSize<0){retSize=0;} }
    const enh={habName:null,cond:null,size:enhSize,noEnhancement:!canEnh,canEnhance:canEnh};
    if(canEnh && enhSize>0){ enh.habName=enhPick.hab.name; enh.cond=enhPick.cond; }
    else { enh.noEnhancement=true; }
    return {bi, retained:{size:retSize}, enhanced:enh, forCreation:{size:lost}};
  });
  // Intentional enhanced duplicates when >5 enhancements: reuse enhancement habitats across groups (rule-permitting), varying condition.
  (function(){
    const enhGroups=groups.filter(g=>g.enhanced.habName && !g.enhanced.noEnhancement && g.enhanced.size>0);
    if(enhGroups.length<=5) return;
    const {dup:dupTarget}=dupSplit(enhGroups.length);
    const condUsed={};
    enhGroups.forEach(g=>{ (condUsed[g.enhanced.habName]=condUsed[g.enhanced.habName]||new Set()).add(g.enhanced.cond); });
    let made=0;
    for(const g of enhGroups){
      if(made>=dupTarget) break;
      const b=baselines[g.bi];
      const usedNames=[...new Set(enhGroups.map(x=>x.enhanced.habName))].filter(nm=>nm!==g.enhanced.habName);
      for(const nm of usedNames){
        const h=habByName[TYPE_NAME[t]+"|"+nm];
        if(h && checkTradingRule(t,b,h)){
          const ec=bestEnhCondVaried(t,h,condUsed);
          if(ec){ g.enhanced.habName=nm; g.enhanced.cond=ec; made++; break; }
        }
      }
    }
  })();
  // created rows fill the For-Creation budget
  const budget=roundN(groups.reduce((a,g)=>a+g.forCreation.size,0),dp);
  const created=[];
  if(budget>0){
    const p=pool(t);
    const baseNames=new Set(baselines.map(b=>b.name));
    // candidates: not in baseline, valid created time, higher distinctiveness preferred
    let cands=p.filter(h=>!baseNames.has(h.name) && bestCreatedCond(t,h)!=null);
    cands.sort((a,b)=>DIST_RANK[b.dist]-DIST_RANK[a.dist]);
    if(!cands.length) cands=p.filter(h=>bestCreatedCond(t,h)!=null);
    const want=Math.max(1, createdCounts[t]);
    let picks=[];
    const distinctPick=i=> cands.length ? (cands[i]||cands[i%cands.length]) : pick(p);
    if(want<=5){
      const nR=Math.max(1, Math.min(want, cands.length||1));
      for(let i=0;i<nR;i++) picks.push(distinctPick(i));
    } else {
      const {dup:dupCount, distinct:distinctTarget}=dupSplit(want);
      for(let i=0;i<distinctTarget;i++) picks.push(distinctPick(i));
      for(let i=0;i<dupCount;i++){ const assessed=picks.filter(h=>h&&h.condMode==="Assessed"); picks.push(assessed.length?pick(assessed):(picks.length?pick(picks):(cands.length?pick(cands):pick(p)))); }
    }
    const nRows=picks.length;
    const sizes=splitSizes(budget,nRows,Math.min(TYPE_MIN_INDIVIDUAL[t],budget/nRows),dp);
    const condUsed={};
    for(let i=0;i<nRows;i++){
      const hh=picks[i]||pick(p);
      created.push({id:TYPE_PREFIX[t]+"C"+(i+1), habName:hh.name, cond:createdCondVaried(t,hh,condUsed), size:sizes[i]});
    }
  }
  return {groups, created};
}

/* ---------- scoring + valid retry ---------- */
// Count real trading-rule failures: habitats with a net unit loss that the trading rules
// leave un-offset (matching the FAILED rows in the Trading Rules Summary detail).
function countTradingFailures(t){
  const tr=computeTrading(t); let n=0;
  Object.keys(tr.shortfallByHab).forEach(nm=>{
    const sf=tr.shortfallByHab[nm]; const h=habByName[TYPE_NAME[t]+"|"+nm];
    if(sf>1e-6 && h && compRequired(t,h.dist)) n++;
  });
  return n;
}
function summarize(t){
  const sd=simData[t]; if(!sd) return null;
  const bl=sd.baselines, gr=sd.groups, cr=sd.created;
  let ub=0, up=0, enhCount=0;
  bl.forEach(b=>{ ub+=baselineUnits(t,b); });
  gr.forEach(g=>{
    const b=bl[g.bi];
    up+=retainedUnits(t,b,g.retained.size);
    const eu=enhancedUnits(t,b,g.enhanced);
    up+=eu;
    if(g.enhanced.habName && !g.enhanced.noEnhancement && eu>0) enhCount++;
  });
  cr.forEach(r=>{ up+=createdUnits(t,r); });
  const failures=countTradingFailures(t);
  // created set trading-rule check against any baseline of >= its requirement: simplified — created of lower
  // distinctiveness than all baselines may fail; check each created passes some baseline rule
  const sizeBase=bl.reduce((a,b)=>a+b.size,0);
  const sizePost=gr.reduce((a,g)=>a+g.retained.size+g.enhanced.size,0)+cr.reduce((a,r)=>a+r.size,0);
  const gain=up-ub; const pct= ub>0 ? gain/ub*100 : 0;
  return {ub,up,gain,pct,failures,enhCount,sizeBase,sizePost,
    forCreationTotal:gr.reduce((a,g)=>a+g.forCreation.size,0),
    createdTotal:cr.reduce((a,r)=>a+r.size,0)};
}
function scoreType(t){
  const s=summarize(t); if(!s) return -1e9;
  return s.pct + (s.failures===0?10000:-1000*s.failures) + (s.enhCount>=2?1000:0) + (s.pct>=10?500:0);
}

// Inject a minimal unoffsettable loss so the scheme fails a trading rule while keeping net gain.
function injectError(t){
  const sd=simData[t]; const dp=dp_for(t); const rank=d=>DIST_RANK[d];
  let cand=sd.groups.map((g,i)=>({g,b:sd.baselines[g.bi]})).filter(x=>!lossOffsettable(t,x.b));
  if(!cand.length) cand=sd.groups.map((g,i)=>({g,b:sd.baselines[g.bi]}));
  if(!cand.length) return;
  cand.sort((a,c)=>rank(c.b.dist)-rank(a.b.dist));
  const g=cand[0].g, b=cand[0].b;
  const chunk=roundN(Math.min(g.retained.size+g.enhanced.size, Math.max(TYPE_MIN_INDIVIDUAL[t], b.size*0.25)), dp);
  if(chunk<=0) return;
  let rem=chunk;
  const tr=Math.min(g.retained.size,rem); g.retained.size=roundN(g.retained.size-tr,dp); rem=roundN(rem-tr,dp);
  if(rem>0){ const te=Math.min(g.enhanced.size,rem); g.enhanced.size=roundN(g.enhanced.size-te,dp); rem=roundN(rem-te,dp); }
  g.forCreation.size=roundN(b.size-g.retained.size-g.enhanced.size,dp);
  // create the freed area as a habitat that cannot offset b (so the loss fails the rules)
  const opts2=pool(t).filter(h=>h.name!==b.name && !checkTradingRule(t,b,h) && bestCreatedCond(t,h)!=null);
  const hh=opts2.length?opts2.sort((a,c)=>rank(c.dist)-rank(a.dist))[0]:null;
  if(hh) sd.created.push({id:TYPE_PREFIX[t]+"X"+sd.created.length, habName:hh.name, cond:bestCreatedCond(t,hh)||condsFor(hh)[0], size:roundN(chunk,dp)});
}
function genType(t, opts){
  opts=opts||{};
  const mode=opts.mode||"valid";
  if(opts.errors){
    let best=null,bestScore=-1e18;
    const consider=()=>{ const s=summarize(t); if(s.pct>=10 && s.failures>=1) return true;
      const sc=(s.failures>=1?2000:0)+(s.pct>=10?1000:0)+s.pct;
      if(sc>bestScore){ bestScore=sc; best={baselines:simData[t].baselines,groups:simData[t].groups,created:simData[t].created}; } return false; };
    for(let i=0;i<250;i++){ const bl=genBaseline(t); const ps=buildPostSet(t,bl,"errors"); simData[t]={baselines:bl,groups:ps.groups,created:ps.created}; if(consider()) return; }
    for(let i=0;i<150;i++){ const bl=genBaseline(t); const ps=buildPostSet(t,bl,"valid"); simData[t]={baselines:bl,groups:ps.groups,created:ps.created}; injectError(t); if(consider()) return; }
    if(best) simData[t]=best;
    return;
  }
  if(opts.validRetry){
    let best=null, bestScore=-1e18;
    for(let i=0;i<60;i++){
      const bl=(opts.regenBaseline!==false || i>=20) ? genBaseline(t) : simData[t].baselines; // keep baseline if it can be made valid; otherwise regenerate
      const ps=buildPostSet(t,bl,"valid");
      const cand={baselines:bl,groups:ps.groups,created:ps.created};
      simData[t]=cand;
      const sc=scoreType(t); const s=summarize(t);
      if(sc>bestScore){ bestScore=sc; best=JSON.parse(JSON.stringify(cand)); rehydrate(best); }
      if(s.pct>=10 && s.enhCount>=2 && s.failures===0) { break; }
    }
    simData[t]=best;
  } else {
    const bl=opts.regenBaseline ? genBaseline(t) : simData[t].baselines;
    const ps=buildPostSet(t,bl,mode);
    simData[t]={baselines:bl,groups:ps.groups,created:ps.created};
  }
}
function rehydrate(state){ // restore hab references after JSON clone
  state.baselines.forEach(b=>{ b.hab=habByName[b.hab.unit+"|"+b.hab.name]||habByName[TYPE_NAME[currentType]+"|"+b.name]; });
}

/* ---------- dropdown builders ---------- */
function habOptions(t, selectedName, baseForRule, sentinelLabel){
  // group by distinctiveness band, only habitats allowed (trading rule) when baseForRule given
  let opts=`<option value="" class="sentinel"${selectedName?"":" selected"}>${sentinelLabel}</option>`;
  if(t==="area"){
    let list=pool(t).slice();
    if(baseForRule) list=list.filter(h=>checkTradingRule(t,baseForRule,h));
    list.sort((a,b)=> (DIST_RANK[a.dist]-DIST_RANK[b.dist]) || a.broad.localeCompare(b.broad) || a.name.localeCompare(b.name));
    let prevBroad=null;
    list.forEach(h=>{
      const sel = h.name===selectedName?" selected":"";
      const grp = h.broad!==prevBroad ? " grp-top":""; prevBroad=h.broad;
      const isBase = !!(baseForRule && h.name===baseForRule.name);
      const longTxt=(esc(h.broad+" - "+h.name)+(isBase?" - BASELINE HABITAT":"")).replace(/"/g,"&quot;");
      opts+=`<option value="${esc(h.name)}"${sel} class="opt-area${grp}${isBase?" baseopt":""}" data-long="${longTxt}" data-short="${esc(h.name)}">${esc(h.name)}</option>`;
    });
    return opts;
  }
  DIST_BANDS.forEach(band=>{
    let list=pool(t).filter(h=>h.dist===band);
    if(baseForRule) list=list.filter(h=>checkTradingRule(t,baseForRule,h));
    if(!list.length) return;
    opts+=`<optgroup label="${DIST_FULL[band]} distinctiveness">`;
    list.forEach(h=>{
      const sel = h.name===selectedName?" selected":"";
      opts+=`<option value="${esc(h.name)}"${sel}>${esc(h.name)}</option>`;
    });
    opts+=`</optgroup>`;
  });
  return opts;
}
function condOptions(h, selected, minBaselineCond){
  const cs=condsFor(h);
  const minIdx=(minBaselineCond!=null)?ASSESSED.indexOf(minBaselineCond):-1;
  return cs.map(c=>{
    if(minIdx>=0 && h.condMode==="Assessed" && ASSESSED.indexOf(c)<=minIdx) return "";
    return `<option value="${esc(c)}"${c===selected?" selected":""}>${esc(c)} (${COND_SCORE[c]})</option>`;
  }).join("");
}

// Per-habitat baseline/post units within the active type
// Per-habitat baseline/post units within the active type (for offset allocation)
function habUnitMap(t){
  const sd=simData[t]; const m={};
  const ensure=nm=>{ if(!m[nm]) m[nm]={name:nm,base:0,post:0,h:habByName[TYPE_NAME[t]+"|"+nm]}; return m[nm]; };
  sd.baselines.forEach(b=>{ ensure(b.name).base+=baselineUnits(t,b); });
  sd.groups.forEach(g=>{ const b=sd.baselines[g.bi];
    ensure(b.name).post+=retainedUnits(t,b,g.retained.size);
    if(g.enhanced.habName && !g.enhanced.noEnhancement) ensure(g.enhanced.habName).post+=enhancedUnits(t,b,g.enhanced);
  });
  sd.created.forEach(r=>{ if(r.habName) ensure(r.habName).post+=createdUnits(t,r); });
  return m;
}
// Allocate each band's surplus units to lower-distinctiveness habitats that have losses,
// per the trading rules (higher distinctiveness may offset lower-distinctiveness losses).
// Real rule-based habitat-to-habitat trading: surplus habitats offset deficit habitats,
// where checkTradingRule permits the surplus habitat as a replacement for the lost one.
function computeTrading(t){
  const m=habUnitMap(t); const rank=b=>DIST_RANK[b];
  const providers=[], consumers=[];
  Object.keys(m).forEach(nm=>{ const e=m[nm]; if(!e.h) return; const net=e.post-e.base;
    if(net>1e-9) providers.push({name:nm,h:e.h,band:e.h.dist,broad:e.h.broad,remaining:net,total:net});
    else if(net<-1e-9) consumers.push({name:nm,h:e.h,band:e.h.dist,broad:e.h.broad,need:-net,recv:0});
  });
  function basis(X,Y){
    if(Y.name===X.name) return "like for like";
    if(rank(Y.band)>rank(X.band)) return "higher distinctiveness";
    if(Y.band===X.band && Y.broad===X.broad) return "same broad habitat";
    if(Y.band===X.band) return "same distinctiveness";
    return "trade";
  }
  consumers.sort((a,b)=>rank(b.band)-rank(a.band) || b.need-a.need);
  const flows=[];
  consumers.forEach(X=>{
    const elig=providers.filter(Y=>Y.remaining>1e-9 && checkTradingRule(t,X.h,Y.h));
    const pf=Y=> Y.band===X.band ? (Y.broad===X.broad?0:1) : 2+(rank(Y.band)-rank(X.band));
    elig.sort((p,q)=>pf(p)-pf(q));
    let need=X.need;
    for(const Y of elig){
      if(need<=1e-9) break;
      const take=Math.min(Y.remaining,need); if(take<=1e-9) continue;
      Y.remaining-=take; need-=take; X.recv+=take;
      flows.push({fromName:Y.name,fromBand:Y.band,toName:X.name,toBand:X.band,amt:take,basis:basis(X,Y)});
    }
    X.shortfall=need;
  });
  const receivedByHab={};
  flows.forEach(f=>{ const r=receivedByHab[f.toName]||(receivedByHab[f.toName]={total:0,lines:{}});
    r.total+=f.amt; const k=f.fromBand+"|"+f.basis;
    (r.lines[k]=r.lines[k]||{band:f.fromBand,basis:f.basis,amt:0}).amt+=f.amt; });
  const shortfallByHab={}; consumers.forEach(c=>shortfallByHab[c.name]=c.shortfall);
  const band={};
  DIST_BANDS.forEach(b=>{
    const surplusTotal=providers.filter(p=>p.band===b).reduce((a,p)=>a+p.total,0);
    const outFlows=flows.filter(f=>f.fromBand===b);                 // offsets from this band (same + lower)
    const byTo={}; outFlows.forEach(f=>{ (byTo[f.toName]=byTo[f.toName]||{amt:0,toBand:f.toBand,toName:f.toName}).amt+=f.amt; });
    const lowerAllocs=Object.values(byTo).sort((a,c)=>c.amt-a.amt);
    const usedTotal=outFlows.reduce((a,f)=>a+f.amt,0);
    const notTraded=Math.max(0,surplusTotal-usedTotal);
    band[b]={surplusTotal,availableForLower:surplusTotal,lowerAllocs,notTraded};
  });
  return {m,flows,receivedByHab,shortfallByHab,band};
}

function tradingSummaryCard(t){
  const sd=simData[t]; const area=t==="area";
  if(!sd.baselines.length) return "";
  const bandCls={"V.High":"band-vhigh","High":"band-high","Medium":"band-medium","Low":"band-low","V.Low":"band-vlow"};
  const inBase=new Set(sd.baselines.map(b=>b.name));
  const inPost=new Set();
  sd.groups.forEach(g=>{ const b=sd.baselines[g.bi]; inPost.add(b.name); if(g.enhanced.habName&&!g.enhanced.noEnhancement) inPost.add(g.enhanced.habName); });
  sd.created.forEach(r=>{ if(r.habName) inPost.add(r.habName); });
  const tr=computeTrading(t);

    sd.baselines.forEach(b=>add(b.name));
    inPost.forEach(n=>add(n));

    let gTot=0,lTot=0;
    const rows=names.map(nm=>{
      const h=habs[nm];

      const bu=e.base, pu=e.post, change=pu-bu;
      const B=inBase.has(nm), P=inPost.has(nm);
      const isLoss = change < -1e-9;
      if(change>1e-9) gTot+=change; else if(change<-1e-9) lTot+=-change;
      const rec=tr.receivedByHab[nm];
      const residual = isLoss ? (tr.shortfallByHab[nm]||0) : 0;
      const nmAttr = esc(nm).replace(/"/g,"&quot;");
      const naTd = `<td class="num cell-null"><span class="muted-italic">n/a</span></td>`;
      const baseTd = (B && bu>1e-9)
        ? `<td class="num unum">${bu.toFixed(2)} <button class="info-btn" data-act="popinfo" data-t="${t}" data-kind="base" data-nm="${nmAttr}">?</button></td>`

        ? `<td class="num unum">${pu.toFixed(2)} <button class="info-btn" data-act="popinfo" data-t="${t}" data-kind="post" data-nm="${nmAttr}">?</button></td>`
        : `<td class="num unum cell-null"><span class="muted-italic">n/a</span></td>`;
      const gainsTd = change>1e-9 ? `<td class="num gain-good">${change.toFixed(2)}</td>` : naTd;
      const lossesTd = change<-1e-9 ? `<td class="num gain-bad">${(-change).toFixed(2)}</td>` : naTd;
      const tradeTd = (isLoss && rec && rec.total>1e-9)
        ? `<td class="trade-cell">${Object.values(rec.lines).map(l=>`<div><span class="gain-good">+${l.amt.toFixed(2)}</span> from ${pillBand(l.band)}</div>`).join("")}</td>`
        : `<td class="trade-cell cell-null"><span class="muted-italic">n/a</span></td>`;
      const notOffsetTd = (isLoss && residual>1e-9) ? `<td class="num"><span class="gain-bad">-${residual.toFixed(2)}</span></td>` : naTd;
      let rulesTd = `<td class="cell-null rules-col"><span class="muted-italic">n/a</span></td>`;
      if(isLoss){
        rulesTd = !compRequired(t,band) ? `<td class="rules-col"><span class="muted-italic">Not required</span></td>`
          : (residual>1e-6 ? `<td class="rules-fail rules-col">Failed</td>` : `<td class="rules-pass rules-col">Passed</td>`);
      }
      return `<tr>`+(area?`<td class="broadcol trd-broad ${bandCls[band]}">${esc(h.broad)}</td>`:``)+`<td class="trd-hab ${bandCls[band]}">${esc(nm)}</td>`+
        baseTd+postTd+gainsTd+lossesTd+tradeTd+notOffsetTd+rulesTd+`</tr>`;
    }).join("");
    const totalsRow = `<tr class="totals-row"><td colspan="${area?4:3}" class="num">Totals</td>`+
      (gTot>1e-9?`<td class="num gain-good">${gTot.toFixed(2)}</td>`:`<td class="num cell-null"><span class="muted-italic">n/a</span></td>`)+
      (lTot>1e-9?`<td class="num gain-bad">${lTot.toFixed(2)}</td>`:`<td class="num cell-null"><span class="muted-italic">n/a</span></td>`)+
      `<td colspan="3"></td></tr>`;
    const bd=tr.band[band];
    let side=`<div class="flowbox"><div class="avail-head"><span class="avail-num">${bd.availableForLower.toFixed(2)}</span> ${pillBand(band)} gains available to offset losses</div>`;
    if(bd.lowerAllocs.length){
      side+=`<div class="offsets-sub">Actual offsets</div>`+bd.lowerAllocs.map(a=>`<div class="kv flow"><span><b>${a.amt.toFixed(2)}</b> → ${pillBand(a.toBand)} ${esc(a.toName)}</span></div>`).join("");
    }
    if(bd.notTraded>1e-9){
      side+=`<div class="kv flow"><span><i>${bd.notTraded.toFixed(2)} → Not traded</i></span></div>`;
    }
    if(bd.availableForLower<=1e-9){
      side+=`<div class="muted-italic" style="margin-top:4px">No surplus units in this band.</div>`;
    }
    side+=`</div>`;
    sections+=`<div class="band ${bandCls[band]}"><h4>${DIST_FULL[band]} distinctiveness</h4>`+
      `<button class="rules-pill" data-act="ruleinfo" data-t="${t}" data-dist="${esc(band)}">Rules</button></div>`+
      `<div class="detail-wrap"><div class="tbl-wrap"><table class="grid trd">${trdCols}`+
      `<tr>`+(area?`<th>Broad habitat</th>`:``)+`<th>Habitat</th><th>Baseline units</th><th>Post units</th><th>Gains</th><th>Losses</th><th>Losses offset by trading</th><th>Not offset</th><th>RULES</th></tr>`+
      rows+totalsRow+`</table></div>${band==="V.Low"?"":`<div class="side">${side}</div>`}</div>`;
  });
  return `<div class="card"><h2 class="card-title">Trading Summary (${TYPE_TITLE[t]})</h2>${sections}</div>`;
}
/* ---------- main render ---------- */
let _measSpan=null;
function sizeHabSelects(){
  if(typeof document.createElement!=="function" || !document.body) return;
  if(!_measSpan){ _measSpan=document.createElement("span"); _measSpan.style.cssText="position:absolute;visibility:hidden;white-space:pre;font-size:12px"; document.body.appendChild(_measSpan); }
  document.querySelectorAll("select.hab").forEach(sel=>{ const o=sel.options[sel.selectedIndex]; if(!o) return; _measSpan.textContent=o.textContent; sel.style.width=(_measSpan.offsetWidth+34)+"px"; });
  document.querySelectorAll("input.size-in").forEach(inp=>{ const L=(String(inp.value).length)||3; inp.style.width=(L*7+24)+"px"; });
}
function decorateBaseline(sel,on){
  const bn=sel.getAttribute("data-baseline"); if(bn==null) return;
  for(let i=0;i<sel.options.length;i++){ const o=sel.options[i]; if(o.value===bn){ o.textContent= on?(bn+" - BASELINE HABITAT"):bn; o.style.fontWeight= on?"700":"400"; } }
}
function isAreaHabSel(sel){ return !!(sel.querySelector && sel.querySelector("option[data-long]")); }
function expandHabOpts(sel,on){
  for(let i=0;i<sel.options.length;i++){ const o=sel.options[i]; const lg=o.getAttribute&&o.getAttribute("data-long"); if(lg==null) continue; o.textContent= on?lg:(o.getAttribute("data-short")||lg); }
}
function renderType(){
  const t=currentType;
  document.getElementById("baselineMount").innerHTML=baselineCard(t);
  document.getElementById("postMount").innerHTML=postCard(t);
  document.getElementById("tradingMount").innerHTML=tradingSummaryCard(t);
  renderHeader();
  sizeHabSelects();
}

/* ---------- auto-rebalance on size edit ---------- */
function onSizeEdit(t,bi,role,val){
  // Invariant: retained + enhanced + forCreation === baseline size (always preserved).
  const g=simData[t].groups[bi]; const b=simData[t].baselines[bi]; const dp=dp_for(t);
  const size=b.size;
  const oldFC=g.forCreation.size;
  let v=parseFloat(val); if(isNaN(v)||v<0) v=0; v=roundN(v,dp);
  if(v>size) v=size;
  const editKey = role==="retained" ? "retained" : "enhanced";
  const otherKey = role==="retained" ? "enhanced" : "retained";
  const otherVal = g[otherKey].size;
  // Natural plan: For Creation absorbs the change -> fc = size - v - otherVal
  let fc = roundN(size - v - otherVal, dp);
  if(fc >= 0){
    // For Creation stays in range; other R/E row untouched.
    g[editKey].size = v;
    g.forCreation.size = fc;
  } else {
    // For Creation would go negative -> park it at 0 and divert the overflow to the other R/E row.
    let newOther = roundN(size - v, dp);               // what the other row must drop to so fc=0
    if(newOther >= 0){
      g[editKey].size = v;
      g[otherKey].size = Math.max(0, newOther);
      g.forCreation.size = roundN(size - g.retained.size - g.enhanced.size, dp);
    } else {
      // Other row cannot absorb (would go below 0): clamp the edited cell instead.
      g[editKey].size = roundN(Math.max(0, size - otherVal), dp);
      g.forCreation.size = roundN(size - g.retained.size - g.enhanced.size, dp);
    }
  }
  // Push this group's change in For Creation onto the first non-zero created habitat,
  // so total created size keeps matching total For Creation (post size == baseline size).
  const cd=roundN(g.forCreation.size-oldFC,dp);
  if(cd!==0){ const cr=simData[t].created; let idx=cr.findIndex(r=>r.size>0); if(idx<0&&cr.length) idx=0; if(idx>=0) cr[idx].size=roundN(Math.max(0,cr[idx].size+cd),dp); }
  renderType();
}

/* ---------- event wiring ---------- */
function wireEvents(){
  document.addEventListener("mousedown",e=>{ const sl=e.target&&e.target.closest&&e.target.closest("select.hab"); if(sl){ if(isAreaHabSel(sl)) expandHabOpts(sl,true); else decorateBaseline(sl,true); } },true);
  document.addEventListener("blur",e=>{ const sl=e.target&&e.target.closest&&e.target.closest("select.hab"); if(sl){ if(isAreaHabSel(sl)) expandHabOpts(sl,false); else decorateBaseline(sl,false); } },true);
  document.addEventListener("click",e=>{
    const el=e.target.closest("[data-act]"); if(!el) return;
    const act=el.dataset.act, t=el.dataset.t;
    if(act==="newbaseline"){ const c=document.getElementById("blCount-"+t); if(c) baselineCounts[t]=Math.max(1,parseInt(c.value)||baselineCounts[t]); genType(t,{validRetry:true,regenBaseline:true}); renderType(); }
    else if(act==="genrandom"){ const c=document.getElementById("poCount-"+t); if(c) createdCounts[t]=Math.max(1,parseInt(c.value)||createdCounts[t]); genType(t,{errors:true,regenBaseline:true}); renderType(); }
    else if(act==="genvalid"){ const c=document.getElementById("poCount-"+t); if(c) createdCounts[t]=Math.max(1,parseInt(c.value)||createdCounts[t]); genType(t,{validRetry:true,regenBaseline:false}); renderType(); }
    else if(act==="enhbin"){ binEnhanced(t,+el.dataset.bi); }
    else if(act==="crbin"){ binCreated(t,+el.dataset.ri); }
    else if(act==="popinfo"){ openModal((el.dataset.kind==="base"?"Baseline habitats \u2014 ":"Post-intervention habitats \u2014 ")+esc(el.dataset.nm), el.dataset.kind==="base"?baselineUnitsPopup(t,el.dataset.nm):postUnitsPopup(t,el.dataset.nm), el); }
    else if(act==="modalclose"){ const ov=document.getElementById("modalOverlay"); if(ov&&ov.classList) ov.classList.remove("show"); }
    else if(act==="ruleinfo"){ const d=el.dataset.dist; openModal(TYPE_NAME[t]+" with "+(DIST_FULL[d]||d)+" distinctiveness", ruleModalHtml(t,d), el); }
  });
  document.addEventListener("change",e=>{
    const el=e.target.closest("[data-act]"); if(!el) return;
    const act=el.dataset.act, t=el.dataset.t;
    if(act==="size"){ onSizeEdit(t,+el.dataset.bi,el.dataset.role,el.value); }
    else if(act==="csize"){ onCreatedSize(t,+el.dataset.ri,el.value); }
    else if(act==="enhhab"){ onEnhHab(t,+el.dataset.bi,el.value); }
    else if(act==="enhcond"){ simData[t].groups[+el.dataset.bi].enhanced.cond=el.value; renderType(); }
    else if(act==="crhab"){ onCrHab(t,+el.dataset.ri,el.value); }
    else if(act==="crcond"){ simData[t].created[+el.dataset.ri].cond=el.value; renderType(); }
  });
  document.querySelectorAll("[data-type-btn]").forEach(btn=>btn.addEventListener("click",()=>{
    currentType=btn.dataset.typeBtn; syncRadios(); renderType();
  }));
  document.querySelectorAll("[data-filter-btn]").forEach(btn=>btn.addEventListener("click",()=>{
    filter=btn.dataset.filterBtn; setDefaultCounts(); buildSimTab(); syncRadios(); renderType();
  }));
}
function binEnhanced(t,bi){
  const g=simData[t].groups[bi]; const dp=dp_for(t);
  const freed=g.enhanced.size;
  g.enhanced.noEnhancement=true; g.enhanced.habName=null; g.enhanced.cond=null;
  g.enhanced.size=0;
  g.forCreation.size=roundN(g.forCreation.size+freed,dp);
  renderType();
}
function binCreated(t,ri){
  const r=simData[t].created[ri];
  r.habName=null; r.cond=null; r.size=0;
  renderType();
}
function onEnhHab(t,bi,name){
  const g=simData[t].groups[bi]; const b=simData[t].baselines[bi]; const dp=dp_for(t);
  if(!name){ binEnhanced(t,bi); return; }
  const h=habByName[TYPE_NAME[t]+"|"+name];
  g.enhanced.noEnhancement=false; g.enhanced.habName=name;
  g.enhanced.cond=bestEnhCond(t,h, h.condMode==="Assessed"?ASSESSED.indexOf(b.cond):-1) || bestEnhCond(t,h,-1) || condsFor(h)[0];
  if(g.enhanced.size===0){
    const take=Math.min(g.forCreation.size, roundN(b.size*0.2,dp));
    g.enhanced.size=roundN(take,dp); g.forCreation.size=roundN(g.forCreation.size-take,dp);
  }
  renderType();
}
function onCrHab(t,ri,name){
  const r=simData[t].created[ri];
  if(!name){ binCreated(t,ri); return; }
  const h=habByName[TYPE_NAME[t]+"|"+name];
  r.habName=name; r.cond=bestCreatedCond(t,h)||condsFor(h)[0];
  renderType();
}
function onCreatedSize(t,ri,val){
  const dp=dp_for(t); let v=parseFloat(val); if(isNaN(v)||v<0)v=0;
  simData[t].created[ri].size=roundN(v,dp); renderType();
}

/* ---------- radio sync ---------- */
function syncRadios(){
  document.querySelectorAll("[data-type-btn]").forEach(b=>b.classList.toggle("active",b.dataset.typeBtn===currentType));
  document.querySelectorAll("[data-filter-btn]").forEach(b=>b.classList.toggle("active",b.dataset.filterBtn===filter));
}

/* ---------- init ---------- */
function ruleModalHtml(t,dist){
  const rref=(RULE_REF[t]&&RULE_REF[t][dist])||{desc:"",logic:""};
  return `<div class="rule-modal"><hr class="rule-sep">`+
    `<p><b>Trading Rule:</b> ${esc(rref.desc)}</p>`+
    `<hr class="rule-sep">`+
    `<p><b>Trading Rule Full Logic:</b><br>${rref.logic}</p></div>`;
}
function ensureModal(){
  if(typeof document.createElement!=="function" || !document.body) return;
  if(document.getElementById("modalOverlay")) return;
  const ov=document.createElement("div"); ov.id="modalOverlay"; ov.className="modal-overlay";
  ov.innerHTML=`<div class="modal-box"><button class="modal-close" data-act="modalclose">\u00d7</button><div id="modalBody"></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{ if(e.target===ov || (e.target.getAttribute&&e.target.getAttribute("data-act")==="modalclose")) ov.classList.remove("show"); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") ov.classList.remove("show"); });
}
function openModal(title,html,anchorEl){
  ensureModal(); const ov=document.getElementById("modalOverlay"); if(!ov||!ov.classList) return;
  const body=document.getElementById("modalBody"); if(body) body.innerHTML=`<h3 class="modal-title">${title}</h3>${html}`;
  ov.classList.add("show");
  const box=ov.querySelector&&ov.querySelector(".modal-box");
  if(box&&anchorEl&&anchorEl.getBoundingClientRect){
    const r=anchorEl.getBoundingClientRect();
    box.style.position="fixed"; box.style.margin="0"; box.style.visibility="hidden";
    const bw=box.offsetWidth||360, bh=box.offsetHeight||200;
    const vw=window.innerWidth||1200, vh=window.innerHeight||800;
    let left=r.right+8; if(left+bw>vw-8) left=Math.max(8,r.left-bw-8);
    let top=r.top;      if(top+bh>vh-8)  top=Math.max(8,vh-bh-8);
    box.style.left=left+"px"; box.style.top=top+"px"; box.style.visibility="visible";
  }
}
function init(){
  filter="MVS"; currentType="area";
  buildSimTab();
  wireEvents(); ensureModal(); syncRadios(); renderType();
}
window.__SIM__={summarize, simData:()=>simData, setFilter:f=>{filter=f;}, buildSimTab, init,
  genType, checkTradingRule, onSizeEdit, computeTrading, countTradingFailures, _state:()=>({filter,currentType})};
if(document.readyState!=="loading") init(); else document.addEventListener("DOMContentLoaded",init);
})();

</script>
