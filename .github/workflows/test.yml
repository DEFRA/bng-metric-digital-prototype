name: Tests

# Runs on every PR (including dependabot PRs) and on pushes to main, so a
# dependency bump that breaks a covered code path is caught before merge.
# Make this a required status check in branch protection to gate merges.
on:
  pull_request:
  push:
    branches:
      - main
  # Re-run the required checks when the merge queue tests a PR against the
  # latest main. Without this trigger the queue has no status to wait on and
  # nothing ever merges.
  merge_group:
    branches:
      - main

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # The release-age cooldown (min-release-age in .npmrc) is incompatible
        # with preparing a git dependency (bng-library): npm injects --before
        # for the git-dep prepare and then rejects it against min-release-age
        # (npm/cli#9005). --ignore-scripts skips that prepare step; the native
        # better-sqlite3 addon (needed by the GeoPackage reader) is rebuilt
        # explicitly afterwards.
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3

      # Only the node:test unit suite runs here. The cucumber suite
      # (npm run test:features) has pre-existing failing scenarios and is
      # left out of the gate until those are triaged; run it locally via
      # `npm test`.
      - name: Run unit tests
        run: npm run test:unit
