name: Tests

# Runs on every PR (including dependabot PRs) and on pushes to main, so a
# dependency bump that breaks a covered code path is caught before merge.
# Make this a required status check in branch protection to gate merges.
on:
  pull_request:
  push:
    branches:
      - main
  # Re-run the required checks when the merge queue tests a PR against the
  # latest main. Without this trigger the queue has no status to wait on and
  # nothing ever merges.
  merge_group:
    branches:
      - main

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # npm's release-age cooldown (min-release-age in .npmrc) collides with
        # the git-dependency prepare step that npm always runs for bng-library:
        # it injects --before and then rejects it against min-release-age
        # (npm/cli#9005). npm ci installs the exact locked versions, so the
        # cooldown is redundant here — strip it for this step only. It stays in
        # .npmrc for npm install / local dev / Dependabot.
        run: |
          sed -i '/^min-release-age=/d' .npmrc
          npm ci

      # Only the node:test unit suite runs here. The cucumber suite
      # (npm run test:features) has pre-existing failing scenarios and is
      # left out of the gate until those are triaged; run it locally via
      # `npm test`.
      - name: Run unit tests
        run: npm run test:unit
