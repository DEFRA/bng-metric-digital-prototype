name: bng-library freshness

# Advisory (non-blocking) check. If the pinned bng-library commit in
# package.json is behind DEFRA/bng-library main, leave/refresh a warning
# comment on the PR. It never fails the build — it only informs.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  freshness:
    name: Check bng-library is latest main
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Compare pinned commit against bng-library main
        id: compare
        run: |
          pinned="$(node -p "require('./package.json').dependencies['bng-library'].split('#')[1]")"
          latest="$(git ls-remote https://github.com/DEFRA/bng-library.git main | cut -f1)"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          # A branch ref (e.g. "#main") floats and is never "behind".
          if [ "$pinned" = "$latest" ] || [ "$pinned" = "main" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert PR comment
        uses: actions/github-script@v7
        env:
          PINNED: ${{ steps.compare.outputs.pinned }}
          LATEST: ${{ steps.compare.outputs.latest }}
          STALE: ${{ steps.compare.outputs.stale }}
        with:
          script: |
            const marker = '<!-- bng-library-freshness -->';
            const { PINNED, LATEST, STALE } = process.env;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body.includes(marker));

            if (STALE !== 'true') {
              if (existing) {
                await github.rest.issues.deleteComment(
                  { owner, repo, comment_id: existing.id });
              }
              return;
            }

            const body = [
              marker,
              '> [!WARNING]',
              '> **`bng-library` is behind `main`.**',
              `> - Pinned: \`${PINNED}\``,
              `> - Latest \`main\`: \`${LATEST}\``,
              `> - [See what's changed](https://github.com/DEFRA/bng-library/compare/${PINNED}...${LATEST})`,
              '>',
              '> Update with:',
              '> ```sh',
              `> npm install "github:DEFRA/bng-library#${LATEST}"`,
              '> ```',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }
