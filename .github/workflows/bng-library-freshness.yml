name: bng-library freshness

# Advisory (non-blocking) check. If the pinned bng-library commit in
# package.json is behind DEFRA/bng-library main, leave/refresh a warning
# comment on the PR. It never fails the build — it only informs.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  freshness:
    name: Check bng-library is latest main
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Compare pin against bng-library main and upsert comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- bng-library-freshness -->';
            const LIB = { owner: 'DEFRA', repo: 'bng-library' };
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const pinned = pkg.dependencies['bng-library'].split('#')[1];

            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body.includes(marker));

            const removeComment = async () => {
              if (existing) {
                await github.rest.issues.deleteComment(
                  { owner, repo, comment_id: existing.id });
              }
            };

            // A branch ref (e.g. "#main") floats and is never "behind".
            if (pinned === 'main') return removeComment();

            const { data: branch } = await github.rest.repos.getBranch(
              { ...LIB, branch: 'main' });
            const latest = branch.commit.sha;

            if (pinned === latest) return removeComment();

            // base...head: ahead_by is how far head (main) is ahead of the
            // pinned commit — i.e. how many commits the pin is behind.
            const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead(
              { ...LIB, basehead: `${pinned}...${latest}` });
            const behind = cmp.ahead_by;

            if (behind <= 0) return removeComment();

            const plural = behind === 1 ? 'commit' : 'commits';
            const body = [
              marker,
              '> [!WARNING]',
              `> **\`bng-library\` is ${behind} ${plural} behind \`main\`.**`,
              `> - Pinned: \`${pinned}\``,
              `> - Latest \`main\`: \`${latest}\``,
              `> - [See what's changed](https://github.com/DEFRA/bng-library/compare/${pinned}...${latest})`,
              '>',
              '> Update with:',
              '> ```sh',
              `> npm install "github:DEFRA/bng-library#${latest}"`,
              '> ```',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }
